services:
  frontend:
    build:
      context: ./frontend
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_API_PROXY_TARGET: http://api:3000
    depends_on:
      api:
        condition: service_started

  api:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      MONGODB_URI: mongodb://mongo:27017/personalnotes
      APP_ORIGIN: http://localhost:5173
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
    volumes:
      - ./backend:/app
      - backend-node-modules:/app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      mongo:
        condition: service_healthy
      mailpit:
        condition: service_started

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"

  mongo:
    image: mongo:8
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mongo-data:
  frontend-node-modules:
  backend-node-modules:
